# Sized for a 16 GB machine that also runs Android Studio (4 GB) and an
# emulator: the Flutter template's 8 GB + 4 GB metaspace pushed builds into
# swap. No heap dump on OOM — it writes multi-GB files.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
# Kotlin's compile daemon otherwise inherits the Gradle heap size.
kotlin.daemon.jvmargs=-Xmx1536m
# Reuse outputs from earlier builds instead of rebuilding unchanged tasks.
org.gradle.caching=true
android.useAndroidX=true
